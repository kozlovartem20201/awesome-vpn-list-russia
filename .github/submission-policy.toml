# Правила бота заявок (scripts/submission.py) и проверки pull request'ов (scripts/pr_guard.py).
# Мейнтейнеры (владелец и коллабораторы с правом записи) проходят без проверок автора.
# CODEOWNERS требует ревью владельца для любых изменений этого файла.

# Минимальный возраст домена сервиса по данным RDAP, дней. Отсекает VPN-однодневки.
# Метка maintainer-approved превращает эту ошибку в предупреждение.
min_domain_age_days = 90

# Логины GitHub, которым запрещено присылать заявки и PR.
blocked_users = []

# Домены, которые нельзя добавлять никогда (вместе с поддоменами).
blocked_domains = []

# Минимальный возраст GitHub-аккаунта автора, дней.
# Авторы, у которых уже есть смёрженный PR в этом репозитории, освобождены.
[min_account_age_days]
new_service = 30   # заявка через форму или PR, добавляющий сервис
update = 7         # PR с правками (цены, опечатки, тексты)

# Лимиты на автора заявок через форму.
[limits]
max_open_submissions = 1
max_submissions_per_30_days = 3

# Мягкие сигналы: заявка обрабатывается, но PR получает метку needs-manual-review.
[anomalies]
young_account_days = 180       # аккаунт моложе и без публичных репозиториев
many_repos_no_followers = 200  # столько репозиториев и ни одного подписчика
